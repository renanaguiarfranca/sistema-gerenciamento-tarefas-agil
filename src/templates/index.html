<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <title>Gerenciamento de Tarefas</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 2rem; background: #f4f4f4; }
    h1, h2 { color: #333; }
    .card { background: #fff; padding: 1rem; border-radius: 8px; box-shadow: 0 1px 5px rgba(0,0,0,0.1); margin-bottom: 1rem; }
    label { display: block; margin-top: 0.5rem; }
    input, textarea, select { width: 100%; padding: 0.5rem; margin-top: 0.3rem; border: 1px solid #ccc; border-radius: 4px; }
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    th, td { padding: 0.75rem; text-align: left; border-bottom: 1px solid #ddd; }
    button { background: #2d8cf0; color: white; border: none; padding: 0.6rem 1rem; border-radius: 4px; cursor: pointer; }
    button.delete { background: #e74c3c; }
    form.inline { display: inline-block; margin-right: 0.5rem; }
  </style>
</head>
<body>
  <h1>Gerenciamento de Tarefas</h1>

  <div class="card">
    <h2>Criar nova tarefa</h2>
    <form action="/tasks" method="post">
      <label for="title">Título</label>
      <input id="title" name="title" placeholder="Título da tarefa" required />
      <label for="description">Descrição</label>
      <textarea id="description" name="description" rows="3" placeholder="Descrição da tarefa" required></textarea>
      <label for="priority">Prioridade</label>
      <select id="priority" name="priority">
        <option>Alta</option>
        <option selected>Média</option>
        <option>Baixa</option>
      </select>
      <button type="submit">Criar tarefa</button>
    </form>
  </div>

  <div class="card">
    <h2>Lista de tarefas</h2>
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Título</th>
          <th>Prioridade</th>
          <th>Status</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody>
        {% for task in tasks %}
        <tr>
          <td>{{ task.id }}</td>
          <td>{{ task.title }}</td>
          <td>{{ task.priority }}</td>
          <td>{{ task.status }}</td>
          <td>
            <form class="inline" action="/tasks/{{ task.id }}/update" method="post">
              <select name="status">
                <option {% if task.status == 'A Fazer' %}selected{% endif %}>A Fazer</option>
                <option {% if task.status == 'Em Progresso' %}selected{% endif %}>Em Progresso</option>
                <option {% if task.status == 'Concluído' %}selected{% endif %}>Concluído</option>
              </select>
              <button type="submit">Atualizar</button>
            </form>
            <form class="inline" action="/tasks/{{ task.id }}/delete" method="post">
              <button class="delete" type="submit">Excluir</button>
            </form>
          </td>
        </tr>
        {% else %}
        <tr>
          <td colspan="5">Nenhuma tarefa encontrada.</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</body>
</html>
